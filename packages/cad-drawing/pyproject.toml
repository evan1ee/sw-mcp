[project]
name = "cad-drawing"
version = "0.1.0"
description = "Production drawing pipeline and checks D1-D10 (spec 11)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cad-ir",
    "cad-geometry",
    "cad-references",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
