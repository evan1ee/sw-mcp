[project]
name = "mcp-server"
version = "0.1.0"
description = "Thin stdio MCP front-end (ADR-041, ADR-044)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp>=1.10",
]

[project.scripts]
sw-mcp-mcp = "mcp_server.__main__:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
